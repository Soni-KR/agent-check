services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentcheck
      POSTGRES_USER: agentcheck
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentcheck -d agentcheck"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://agentcheck:local-demo-only@db:5432/agentcheck
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
volumes:
  postgres_data:
